# reverse-proxy/coraza.conf
SecRuleEngine On
SecConnEngine On

# --- LOGS ---
SecAuditLog /var/log/coraza_audit.log
SecAuditLogType Serial
SecDebugLog /var/log/coraza_debug.log
SecDebugLogLevel 3

# === PASSO 1: CONTAGEM POR IP (usando `global`) ===
# Usamos a coleção 'global' com uma chave que inclui o IP e o prefixo "counter_"
SecRule REQUEST_URI "!@streq /health" \
    "id:9001,\
    phase:2,\
    pass,\
    nolog,\
    setvar:tx.dos_counter=+1"

