# reverse-proxy/coraza.conf
SecRuleEngine On
SecConnEngine On
SecRequestBodyAccess On

# --- LOGS ---
SecAuditLog /var/log/coraza_audit.log
SecAuditLogType Serial
SecDebugLog /var/log/coraza_debug.log
SecDebugLogLevel 3

# =========================================================================
# 3. ATIVAR O INJECTOR/PARSER DE JSON (FASE 1)
# =========================================================================
# Esta regra força o Coraza a carregar o analisador JSON caso a requisição
# seja do tipo "application/json". Isso preenche a coleção JSON com as chaves do payload.
SecRule REQUEST_HEADERS:Content-Type "@rx application/json" \
    "id:10000,\
    phase:1,\
    pass,\
    nolog,\
    ctl:requestBodyProcessor=JSON"

# =========================================================================
# 4. REGRAS DE DEFESA POR ASSINATURA CONTRA DoS (FASE 1 & 2)
# =========================================================================

# REGRA DE ALTA PERFORMANCE (FASE 1): Bloqueia cabeçalhos com Content-Length abusivo.
# Isto é extremamente rápido porque bloqueia o ataque na Fase 1, antes de ler o corpo da requisição.
SecRule REQUEST_URI "@rx /(users|token)" \
    "id:10003,\
    phase:2,\
    chain,\
    deny,\
    status:400,\
    msg:'DoS Signature Detected - Request content length is abnormally large',\
    log"
    SecRule REQUEST_HEADERS:Content-Length "@gt 350"

# Inspeciona especificamente a coleção JSON (FASE 2) usando Expressões Regulares (@rx)
# para validar o tamanho dos campos de texto de forma compatível e de alta performance.

# Bloquear se o e-mail enviado no JSON tiver mais de 120 caracteres
SecRule JSON:email "@rx .{121,}" \
    "id:10001,\
    phase:2,\
    deny,\
    status:400,\
    msg:'DoS Signature Detected - Email payload abnormally large',\
    log"

# Bloquear se a senha enviada no JSON tiver mais de 256 caracteres
SecRule JSON:password "@rx .{257,}" \
    "id:10002,\
    phase:2,\
    deny,\
    status:400,\
    msg:'DoS Signature Detected - Password payload abnormally large',\
    log"