# /etc/coraza/coraza.conf
directives:
  - SecRuleEngine: On
  - SecRequestBodyAccess: On
  - SecResponseBodyAccess: On
  - SecRequestBodyLimit: 13107200
  - SecResponseBodyLimit: 5242880
  - SecAuditEngine: RelevantOnly
  - SecAuditLog: /var/log/coraza/audit.log
  - SecDebugLog: /var/log/coraza/debug.log
  - SecDebugLogLevel: 0
  - SecArgumentSeparator: "&"
  - SecCookieFormat: 0
  - SecUnicodeMapFile: /etc/coraza/unicode.mapping

# Incluir regras OWASP CRS
include:
  - /etc/coraza/crs-setup.conf
  - /etc/coraza/rules/*.conf
  - /etc/coraza/custom-rules.conf