# reverse-proxy/coraza.conf - VERSÃO MÍNIMA
SecRuleEngine On
SecDebugLog /var/log/coraza_debug.log
SecDebugLogLevel 5

# Regra de teste - bloqueia qualquer requisição com o parâmetro "test=block"
SecRule ARGS:test "@streq block" \
    "id:1000,\
    phase:2,\
    deny,\
    status:403,\
    msg:'Test rule matched'"