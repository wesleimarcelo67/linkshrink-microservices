# Bloqueia IPs com muitas requisições de ataque
SecRule IP:REQUEST_RATE "@gt 100" \
    "id:1001,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Too many requests from single IP',\
    tag:'MALICIOUS',\
    setvar:'tx.anomaly_score=+%{tx.critical_anomaly_score}'"

# Bloqueia scanners automáticos
SecRule REQUEST_HEADERS:User-Agent "(nikto|sqlmap|nmap|w3af|acunetix)" \
    "id:1002,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Security scanner detected',\
    tag:'MALICIOUS'"

# Detecção de força bruta em login
SecRule ARGS:password "@detectBruteForce" \
    "id:1003,\
    phase:2,\
    deny,\
    status:403,\
    msg:'Brute force attack detected',\
    tag:'ATTACK'"

# Bloqueia após 10 erros 429 (rate limiting do Nginx)
SecRule RESPONSE_STATUS "^429" \
    "id:1004,\
    phase:3,\
    chain,\
    t:none,\
    setvar:'ip.malicious_counter=+1',\
    expirevar:'ip.malicious_counter=3600'"
SecRule IP:MALICIOUS_COUNTER "@gt 10" \
    "t:none,\
    deny,\
    status:403,\
    msg:'IP blocked for excessive violations',\
    tag:'BLOCKED'"

# REQUEST-912-DOS-PROTECTION.conf (parcial)
SecAction \
    "id:912100,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.dos_burst_time_slice=60',\
    setvar:'tx.dos_counter_threshold=100',\
    setvar:'tx.dos_block_timeout=600'"

SecRule IP:DOS_COUNTER "@gt %{tx.dos_counter_threshold}" \
    "id:912110,\
    phase:1,\
    deny,\
    t:none,\
    setvar:'ip.dos_block=1',\
    expirevar:'ip.dos_block=%{tx.dos_block_timeout}',\
    msg:'Denial of Service (DoS) attack identified from %{tx.real_ip} (%{tx.dos_counter} hits since last alert)'"