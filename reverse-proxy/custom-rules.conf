# Regras personalizadas para Coraza
SecAction \
    "id:1001,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.dos_burst_time_slice=60',\
    setvar:'tx.dos_counter_threshold=100',\
    setvar:'tx.dos_block_timeout=600'"

SecRule IP:DOS_COUNTER "@gt %{tx.dos_counter_threshold}" \
    "id:1002,\
    phase:1,\
    deny,\
    status:403,\
    t:none,\
    setvar:'ip.dos_block=1',\
    expirevar:'ip.dos_block=%{tx.dos_block_timeout}',\
    msg:'DoS attack detected'"

SecRule REQUEST_HEADERS:User-Agent "(nikto|sqlmap|nmap|w3af|acunetix)" \
    "id:1003,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Security scanner detected'"