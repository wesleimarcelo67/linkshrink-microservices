# docker-compose.yml

version: '3.8'

services:
  # --- Service Dependencies ---
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:6-alpine
  
  user-db:
    image: postgres:13-alpine
    volumes: [user_db_data:/var/lib/postgresql/data]
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=user_db
    # --- THIS IS THE NEW PART ---
    # This tells Docker how to check if Postgres is ready to accept connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1024m
    cpus: '2'
    # --------------------------
  
  link-db:
    image: postgres:13-alpine
    volumes: [link_db_data:/var/lib/postgresql/data]
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=link_db
    # --- THIS IS THE NEW PART ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d link_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1024m
    cpus: '2'
    # --------------------------

  # --- Application Services ---
  user-service:
    build: ./user-service
    environment:
      - DATABASE_URL=postgresql://user:password@user-db/user_db
      - JWT_SECRET_KEY=710fc70a238cc61ae2abce051dcabeb6e4b4a6d8c085b2f51ed72dbb1a18c6a1
    # --- THIS IS THE UPDATED PART ---
    # This now waits for the 'user-db' to pass its healthcheck before starting.
    depends_on:
      user-db:
        condition: service_healthy
    mem_limit: 512m
    cpus: '0.5'
    # ------------------------------

  link-service:
    build: ./link-service
    environment:
      - DATABASE_URL=postgresql://user:password@link-db/link_db
      - JWT_SECRET_KEY=710fc70a238cc61ae2abce051dcabeb6e4b4a6d8c085b2f51ed72dbb1a18c6a1
      # We provide this for local testing as well
      - BASE_URL=http://localhost:8080
    # --- THIS IS THE UPDATED PART ---
    depends_on:
      link-db:
        condition: service_healthy
    mem_limit: 512m
    cpus: '0.5'
    # ------------------------------
  
  redirect-service:
    build: ./redirect-service
    environment:
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      # Provide this for internal calls during local dev
      - LINK_SERVICE_URL=http://link-service:8000
    depends_on: [redis, rabbitmq, link-service]
    mem_limit: 512m
    cpus: '0.5'

  analytics-service:
    build: ./analytics-service
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on: [rabbitmq]
    mem_limit: 512m
    cpus: '0.5'

  reverse-proxy:
    build:
      context: ./reverse-proxy
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD-SHELL",
          "curl -f http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    cpus: '0.5'
    depends_on:
      user-service: 
        condition: service_started

  # --- API Gateway ---
  gateway:
    image: nginx:1.21-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80" 
    depends_on:
      reverse-proxy:
        condition: service_healthy
      user-service:
        condition: service_started
      link-service:
        condition: service_started
      redirect-service:
        condition: service_started
      linkshrink-vue-gui:
        condition: service_started
    mem_limit: 512m
    cpus: '0.5'
    command: >
      sh -c "
      echo 'Aguardando serviços...';
      sleep 10;
      nginx -t;
      nginx -g 'daemon off;'
      "
  
  # --- V2.0 User Interface (Vue.js Development Server) ---
  linkshrink-vue-gui:
    build:
      context: ./linkshrink-vue-gui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./linkshrink-vue-gui:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    expose:
      - "80"
    mem_limit: 512m
    cpus: '0.5'

volumes:
  user_db_data:
  link_db_data: